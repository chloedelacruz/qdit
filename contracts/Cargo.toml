[workspace]
resolver = "2"
members = ["milestone_proof"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
soroban-sdk = "27.0.4"

# Cargo only honours profiles declared in the workspace root.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Keeps `cargo test --release` usable without the wasm-size tuning above.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
