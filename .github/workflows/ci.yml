name: CI

# The Playwright suite runs only on a local machine, never on CI, here or in any
# other workflow. It would waste CI time. It also runs against production with
# RLS enforced, so it needs
# E2E_EMAIL / E2E_PASSWORD and a database that write specs are allowed to
# mutate, and two concurrent runs would fight over one database.
# See the end-to-end tests note in README.md.

# Only `main` runs here. Every other branch is checked before it leaves the
# machine: .githooks/pre-push runs scripts/ci-local.sh, which runs these same
# jobs locally for the parts of the tree the push touches. Enable it once per
# clone with `git config core.hooksPath .githooks`.
on:
  push:
    branches: [main]

# A second push to main makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      # 24, not 20, and the lock file is the reason. npm 10 (which ships with
      # Node 20) and npm 11 disagree about which optional peer dependencies
      # belong in package-lock.json — @creit.tech/stellar-wallets-kit pulls
      # @trezor/connect-plugin-stellar, which asks for @stellar/stellar-sdk
      # ^13.3.0 against the ^16 we use, and that unresolved peer is where the
      # two versions diverge. A lock written by npm 11 then fails `npm ci`
      # under npm 10 with "Missing: typescript@4.9.5 from lock file".
      #
      # Matching the npm major to the one that writes the lock is the fix.
      # Node 20 is deprecated on the runners regardless — the actions here were
      # already being forced onto Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Vitest, unlike Playwright, is pure logic — no browser, no database, no
      # secrets — so it runs here. It covers the milestone state machine, the
      # filter round trip and the strkey validators. The milestone rules are the
      # ones that matter most: `updateMilestoneStatus` mirrors what
      # `milestone_proof` enforces on-chain, and a silent divergence between the
      # two is the expensive kind.
      - run: npm test

      # `next build` typechecks too, but it also catches what tsc cannot: a
      # server/client boundary violation, a bad import in a route handler.
      - run: npm run build
        env:
          # Build-time only. The client reads these at runtime from the real
          # environment; these exist so the build does not fail on a missing
          # value while prerendering.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          # Anchoring is off when this is empty, which is what CI wants: the
          # build must not depend on a deployed contract.
          NEXT_PUBLIC_MILESTONE_PROOF_CONTRACT_ID: ""

  contracts:
    name: contracts — fmt, clippy, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      # rustfmt and clippy are not in the default profile — asked for by name,
      # or the two lint steps below fail with "no such command".
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

  packages:
    name: packages — typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages

    steps:
      - uses: actions/checkout@v4

      # Node 24 runs the .ts tests directly, with no build step or test
      # framework. The Merkle tests read docs/merkle/vectors.json, the same
      # file the milestone_proof_v2 tests load, so the TypeScript library and
      # the contract are checked against one set of vectors.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - run: npm ci

      # First, because qdit-batch imports @qdit/merkle through its dist/.
      - run: npm run build

      - run: npm run typecheck

      - run: npm test

  wasm:
    name: contracts — build wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
          # The `contracts` job above caches the host target. Sharing one cache
          # between a host build and a wasm build makes them evict each other.
          cache-targets: false

      # Pinned rather than "latest": the CLI decides the wasm optimisation pass,
      # so an unpinned upgrade would change the artifact hash without a commit
      # to explain it — and the hash is what README.md publishes as proof the
      # deployed bytes match this source.
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: "27.0.0"
        run: |
          set -euo pipefail
          asset="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${asset}"
          curl -fsSL "$url" -o /tmp/stellar-cli.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          sudo install -m 755 /tmp/stellar /usr/local/bin/stellar
          stellar --version

      - run: stellar contract build

      - uses: actions/upload-artifact@v4
        with:
          name: milestone_proof-wasm
          path: contracts/target/wasm32v1-none/release/milestone_proof.wasm
          # A silently empty artifact would let a broken build look green.
          if-no-files-found: error

  database:
    name: database — migrations, pgTAP
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The SQL guards are where the integration's security actually lives:
      # RLS, the D-03 OAuth write guards, revocation (D-59, D-75, D-96), the
      # doc-link origin check (D-95) and the webhook scheduler (D-57). The
      # pgTAP files under supabase/tests/ pin them, but until this job they ran
      # by hand on a PGlite stand-in, so a migration could break one and the PR
      # still go green.
      #
      # Both versions are pinned, as with the Stellar CLI above: the CLI
      # decides which Postgres, Auth and pg_prove images the run uses, and an
      # unpinned upgrade would change the database under the tests without a
      # commit to explain it. 2.121.0 is the first pin chosen; it knows the
      # [auth.oauth_server] section in config.toml.
      - uses: supabase/setup-cli@v2.1.2
        with:
          version: 2.121.0

      # Only Postgres, and never the hosted project: no `supabase link`, no
      # access token, no secrets. `db start` builds the local database the way
      # `supabase start` does — Supabase's own auth, storage and extension
      # schemas (pg_cron, pg_net and Vault are real here, not the PGlite
      # stand-ins), then supabase/migrations/ in filename order, then
      # supabase/seed.sql. A migration that fails to apply fails this step.
      - run: supabase db start

      # Every file under supabase/tests/ through pg_prove. Each file is one
      # transaction that ends in a rollback, so the files cannot leak state
      # into each other and their order does not matter.
      - run: supabase test db

      - if: always()
        run: supabase stop --no-backup
