name: CI

# The Playwright suite is deliberately not here. It runs against the real hosted
# Supabase project with RLS enforced — there are no fixtures — so it needs
# E2E_EMAIL / E2E_PASSWORD and a database that write specs are allowed to
# mutate. Putting it in the default PR check would make every fork's build fail
# on missing secrets and let two concurrent runs fight over one database.
# See sessions/*/plan.md and the e2e section of README.md.

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Vitest, unlike Playwright, is pure logic — no browser, no database, no
      # secrets — so it runs here. It covers the milestone state machine, the
      # filter round trip and the strkey validators. The milestone rules are the
      # ones that matter most: `updateMilestoneStatus` mirrors what
      # `milestone_proof` enforces on-chain, and a silent divergence between the
      # two is the expensive kind.
      - run: npm test

      # `next build` typechecks too, but it also catches what tsc cannot: a
      # server/client boundary violation, a bad import in a route handler.
      - run: npm run build
        env:
          # Build-time only. The client reads these at runtime from the real
          # environment; these exist so the build does not fail on a missing
          # value while prerendering.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_STELLAR_NETWORK: testnet

  contracts:
    name: contracts — fmt, clippy, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      # rustfmt and clippy are not in the default profile — asked for by name,
      # or the two lint steps below fail with "no such command".
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test
